<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anthropic API Key Checker</title>
<style>
  :root {
    --bg: #1a1a1a;
    --panel: #232323;
    --border: #333;
    --text: #e8e6e1;
    --muted: #9a9691;
    --accent: #cc785c;
    --good: #5fb87a;
    --bad: #e0665e;
    --warn: #d9a441;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 480px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    position: relative;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    margin-bottom: 4px;
  }
  h1 {
    font-size: 20px;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  .lang-select {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--muted);
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
    outline: none;
    flex-shrink: 0;
  }
  .lang-select:focus { border-color: var(--accent); }
  .sub {
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 24px;
    line-height: 1.5;
  }
  label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .key-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  input[type="password"], input[type="text"] {
    flex: 1;
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 11px 12px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    outline: none;
    min-width: 0;
  }
  input:focus { border-color: var(--accent); }
  button.toggle {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 12px;
    padding: 0 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.toggle:hover { color: var(--text); }
  button.check {
    width: 100%;
    background: var(--accent);
    color: #1a1a1a;
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.check:hover { opacity: 0.9; }
  button.check:disabled { opacity: 0.5; cursor: default; }
  .result {
    margin-top: 20px;
    padding: 14px 16px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
    display: none;
  }
  .result.show { display: block; }
  .result.good { background: rgba(95, 184, 122, 0.1); border: 1px solid rgba(95, 184, 122, 0.35); color: var(--good); }
  .result.bad { background: rgba(224, 102, 94, 0.1); border: 1px solid rgba(224, 102, 94, 0.35); color: var(--bad); }
  .result.warn { background: rgba(217, 164, 65, 0.1); border: 1px solid rgba(217, 164, 65, 0.35); color: var(--warn); }
  .result .status-line {
    font-weight: 600;
    margin-bottom: 4px;
  }
  .result .detail {
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
  }
  .tier-box {
    display: none;
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 8px;
    background: #1c1c1c;
    border: 1px solid var(--border);
  }
  .tier-box.show { display: block; }
  .tier-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .tier-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
  }
  .tier-stat {
    background: #161616;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
  }
  .tier-stat .label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 3px;
  }
  .tier-stat .value {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
  }
  .tier-note {
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
  }
  .footnote {
    margin-top: 20px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 16px;
  }
  .footnote a { color: var(--muted); }
  .spinner {
    display: inline-block;
    width: 13px;
    height: 13px;
    border: 2px solid rgba(26,26,26,0.3);
    border-top-color: #1a1a1a;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: -2px;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="top-row">
      <h1 id="t-title">Anthropic API Key Checker</h1>
      <select class="lang-select" id="langSelect" aria-label="Language"></select>
    </div>
    <p class="sub" id="t-sub">Paste a key to verify it's valid. The key is sent directly from your browser to Anthropic's API — it is never stored or sent anywhere else.</p>

    <label for="apiKey" id="t-label">API Key</label>
    <div class="key-row">
      <input type="password" id="apiKey" placeholder="sk-ant-api03-..." autocomplete="off" spellcheck="false">
      <button class="toggle" id="toggleBtn" type="button">Show</button>
    </div>

    <button class="check" id="checkBtn" type="button">Check key</button>

    <div class="result" id="result">
      <div class="status-line" id="statusLine"></div>
      <div class="detail" id="detailLine"></div>
    </div>

    <div class="tier-box" id="tierBox">
      <div class="tier-title" id="t-tierTitle">Usage tier &amp; rate limits</div>
      <div class="tier-grid" id="tierGrid"></div>
      <div class="tier-note" id="tierNote"></div>
    </div>

    <div class="footnote" id="footnote"></div>
  </div>

const langNames = {
  en: 'English', es: 'Español', fr: 'Français', de: 'Deutsch',
  pt: 'Português', ja: '日本語', 'zh-Hans': '中文（简体）', ko: '한국어'
};

let currentLang = 'en';

function detectLang() {
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('zh')) return 'zh-Hans';
  const base = nav.split('-')[0];
  return translations[base] ? base : 'en';
}

function t(key, vars) {
  let str = (translations[currentLang] && translations[currentLang][key]) || translations.en[key] || '';
  if (vars) {
    Object.keys(vars).forEach(k => { str = str.split('{' + k + '}').join(vars[k]); });
  }
  return str;
}

function applyStaticTranslations() {
  document.getElementById('t-title').textContent = t('title');
  document.getElementById('t-sub').textContent = t('sub');
  document.getElementById('t-label').textContent = t('label');
  document.getElementById('t-tierTitle').textContent = t('tierTitle');
  toggleBtn.textContent = apiKeyInput.type === 'password' ? t('show') : t('hide');
  checkBtn.textContent = checkBtn.disabled ? t('checking') : t('check');
  document.getElementById('footnote').innerHTML = t('footnote');
  document.documentElement.lang = currentLang === 'zh-Hans' ? 'zh-Hans' : currentLang;
}

function initLangSelector() {
  const select = document.getElementById('langSelect');
  Object.keys(translations).forEach(code => {
    const opt = document.createElement('option');
    opt.value = code;
    opt.textContent = langNames[code] || code;
    select.appendChild(opt);
  });
  currentLang = detectLang();
  select.value = currentLang;
  select.addEventListener('change', () => {
    currentLang = select.value;
    applyStaticTranslations();
  });
}

/* ---------------- app logic ---------------- */
const apiKeyInput = document.getElementById('apiKey');
const toggleBtn = document.getElementById('toggleBtn');
const checkBtn = document.getElementById('checkBtn');
const result = document.getElementById('result');
const statusLine = document.getElementById('statusLine');
const detailLine = document.getElementById('detailLine');
const tierBox = document.getElementById('tierBox');
const tierGrid = document.getElementById('tierGrid');
const tierNote = document.getElementById('tierNote');

initLangSelector();
applyStaticTranslations();

toggleBtn.addEventListener('click', () => {
  const isPassword = apiKeyInput.type === 'password';
  apiKeyInput.type = isPassword ? 'text' : 'password';
  toggleBtn.textContent = isPassword ? t('hide') : t('show');
});

function showResult(kind, statusText, detailText) {
  result.className = 'result show ' + kind;
  statusLine.textContent = statusText;
  detailLine.textContent = detailText;
}

function statFrom(headers, name, label) {
  const val = headers.get(name);
  if (!val) return null;
  const div = document.createElement('div');
  div.className = 'tier-stat';
  div.innerHTML = '<div class="label">' + label + '</div><div class="value">' + val + '</div>';
  return div;
}

async function checkKey() {
  const key = apiKeyInput.value.trim();
  if (!key) {
    showResult('warn', t('enterKey'), '');
    return;
  }

  checkBtn.disabled = true;
  checkBtn.innerHTML = '<span class="spinner"></span>' + t('checking');
  result.className = 'result';
  tierBox.className = 'tier-box';
  tierGrid.innerHTML = '';
  tierNote.textContent = '';

  const isAdminKey = key.startsWith('sk-ant-admin');

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-3-5-haiku-20241022',
        max_tokens: 1,
        messages: [{ role: 'user', content: 'hi' }]
      })
    });

    const data = await response.json().catch(() => null);

    if (response.ok) {
      showResult('good', t('validTitle'), t('validDetail'));
    } else if (response.status === 401) {
      showResult('bad', t('invalidTitle'), (data && data.error && data.error.message) || t('invalidDetail'));
    } else if (response.status === 429) {
      showResult('warn', t('rateLimitedTitle'), t('rateLimitedDetail'));
    } else if (response.status === 400 && data && data.error && /credit|billing/i.test(data.error.message || '')) {
      showResult('warn', t('noCreditTitle'), (data.error && data.error.message) || '');
    } else {
      showResult('warn', t('unexpectedTitle') + ' (' + response.status + ')', (data && data.error && data.error.message) || t('unexpectedDetail'));
    }

    // Try to surface whatever rate-limit / usage-tier signal is actually available.
    const stats = [
      statFrom(response.headers, 'anthropic-ratelimit-requests-limit', t('reqMin')),
      statFrom(response.headers, 'anthropic-ratelimit-input-tokens-limit', t('inTokMin')),
      statFrom(response.headers, 'anthropic-ratelimit-output-tokens-limit', t('outTokMin'))
    ].filter(Boolean);

    if (stats.length) {
      stats.forEach(s => tierGrid.appendChild(s));
      tierBox.className = 'tier-box show';
      tierNote.textContent = t('tierNoteHeaders');
    } else if (response.ok || response.status === 429) {
      tierBox.className = 'tier-box show';
      tierNote.textContent = t('tierNoteNoHeaders');
    }

    // Admin keys can read the org's configured limits directly.
    if (isAdminKey) {
      try {
        const adminResp = await fetch('https://api.anthropic.com/v1/organizations/rate_limits', {
          headers: {
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          }
        });
        const adminData = await adminResp.json().catch(() => null);
        tierBox.className = 'tier-box show';
        if (adminResp.ok && adminData && adminData.data && adminData.data.length) {
          tierGrid.innerHTML = '';
          const first = adminData.data[0];
          (first.limits || []).forEach(l => {
            const div = document.createElement('div');
            div.className = 'tier-stat';
            div.innerHTML = '<div class="label">' + l.type.replace(/_/g, ' ') + '</div><div class="value">' + l.value.toLocaleString() + '</div>';
            tierGrid.appendChild(div);
          });
          tierNote.textContent = t('tierNoteAdmin', { model: first.models ? first.models[0] : 'model group' });
        } else {
          tierNote.textContent = t('tierNoteAdminFail', { status: adminResp.status });
        }
      } catch (e) {
        tierNote.textContent = t('tierNoteAdminError', { msg: e.message });
      }
    }
  } catch (err) {
    showResult('bad', t('requestFailedTitle'), t('requestFailedDetail', { msg: err.message }));
  } finally {
    checkBtn.disabled = false;
    checkBtn.textContent = t('check');
  }
}

checkBtn.addEventListener('click', checkKey);
apiKeyInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') checkKey();
});
</script>
